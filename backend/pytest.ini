[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Unit tests
    integration: Integration tests (require DB/Redis)
    security: Security tests
    slow: Slow tests (large datasets)
env =
    ENVIRONMENT=testing
    SECRET_KEY=test-secret-key-minimum-64-chars-long-for-testing-purposes-only-x
    POSTGRES_HOST=localhost
    POSTGRES_USER=csvstats_test
    POSTGRES_PASSWORD=test_secret
    POSTGRES_DB=csvstats_test
    REDIS_HOST=localhost
    STORAGE_BACKEND=local
    LOCAL_STORAGE_PATH=/tmp/csv-stats-test-uploads
    AI_ENABLED=false